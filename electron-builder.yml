appId: com.kioskapp.desktop
productName: witworldwide
copyright: Copyright © 2026 witworldwide

# REQUIRED for this app: `maximum` shrinks the embedded app block enough that
# 32-bit makensis can build the NSIS installer. With the default ('normal'),
# makensis fails with "Internal compiler error #12345: error mmapping datablock"
# because this build is large (~400 MB of renderer assets). Do not lower this
# without first trimming the bundle size, or the installer (and thus auto-update)
# will not build.
compression: maximum

directories:
  output: release/${version}
  buildResources: build

# Bundle the compiled output and the native better-sqlite3 module.
files:
  - out/**/*
  - package.json
  # Vendored NestJS payment agent (compiled JS, incl. its dist/package.json
  # marking the subtree commonjs). Its runtime deps live in the app's own
  # node_modules (declared in package.json), so they are ASAR-packed and
  # ABI-rebuilt for Electron alongside the rest of the app. Spawned as an
  # isolated Node child (ELECTRON_RUN_AS_NODE) on card-terminal kiosks (W003).
  - payment-agent/dist/**/*

extraResources:
  - from: themes
    to: themes
  # MediaPipe hand-landmark runtime for 제주's gesture-gated camera countdown.
  # Served to the renderer over appres:// (see src/main/core/appResourceProtocol.ts)
  # because a packaged renderer runs from file://, where the WASM loader's script
  # tag and .wasm fetch are both blocked. Regenerate with `npm run vendor:mediapipe`.
  - from: resources/mediapipe
    to: mediapipe
  # NOTE: display/attract videos are intentionally NOT bundled. They are large and
  # pre-downloaded per kiosk into an EXTERNAL folder (C:\KioskVideos by default, or
  # KIOSK_VIDEOS_DIR) that lives OUTSIDE the install dir, so an auto-update never
  # wipes them. See src/main/core/paths.ts `videos` and docs/AUTO_UPDATE.md.
  # Runtime config + Google service-account secret (read from resources/ in the
  # packaged app). Keep these out of source control; they are baked into the
  # installer for this controlled kiosk fleet.
  - from: .env
    to: .env
  # Per-machine kiosk provisioning helper (sets electron-store kioskId).
  - from: provision-kiosk.ps1
    to: provision-kiosk.ps1
  # OS-level touch/kiosk lockdown (disables edge-swipe, Win key, Task Manager).
  - from: scripts/lockdown-kiosk.ps1
    to: lockdown-kiosk.ps1
  - from: secrets
    to: secrets

# Native modules must not be ASAR-packed unextracted (better-sqlite3 + the
# payment agent's serialport bindings).
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
  - node_modules/serialport/**
  - node_modules/@serialport/**

npmRebuild: true

win:
  # App/exe icon (taskbar, window, installer). Multi-size .ico generated from the
  # brand logo — see build/icon.ico. buildResources:build would auto-detect it,
  # but keep it explicit so a rename can't silently drop the icon.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Build_<buildVer>_<buildDate>_v<appVersion>_<location>_<channel>_<releaseDate>
  # e.g. Build_V4_20260430_v5.0.5_북인사_live_2026.05.01.exe
  # Env tokens are injected by scripts/build-win.mjs (date/version auto, labels
  # overridable: BUILD_VER, KIOSK_LOC, CHANNEL, RELEASE_DATE).
  artifactName: Build_${env.BUILD_VER}_${env.BUILD_DATE}_v${version}_${env.KIOSK_LOC}_${env.CHANNEL}_${env.RELEASE_DATE}.${ext}
  sign: null
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# Auto-update feed = GitHub Releases (electron-updater). This block is baked into
# the app as `app-update.yml`, so each installed kiosk knows where to look. The
# channel a kiosk actually follows (latest vs beta) is chosen at runtime from
# UPDATE_CHANNEL — see src/main/updater. electron-builder emits the update
# metadata (latest.yml for stable, beta.yml for -beta pre-releases) plus a
# .blockmap next to each NSIS installer automatically.
publish:
  provider: github
  owner: wit-project-sku
  repo: kiosk-electron
  # Channel is derived from the VERSION, not hardcoded: a stable `X.Y.Z` writes
  # `latest.yml`; a `X.Y.Z-beta.N` pre-release writes `beta.yml`. Both coexist in
  # the same repo's releases, so the two channels never collide.
  # Production publishes a normal release (default below); the beta workflow
  # overrides this to `prerelease` via `-c.publish.releaseType=prerelease`.
  releaseType: release

# Windows-only fleet: NSIS installer + latest.yml + .blockmap. No mac/linux.
