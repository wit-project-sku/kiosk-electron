name: release-beta

# Testing channel (beta). Fires on every push to `dev` (a merged PR is a push). Publishes a GitHub PRE-release one MINOR ahead of the newest stable
# release (5.0.18 stable -> 5.1.0-beta.<run_number>) — see "Resolve version" in
# release.yml for why a beta must outrank production instead of trailing it.
# Testing kiosks (UPDATE_CHANNEL=beta) pick it up automatically; production kiosks
# never see it.
#
# Runtime config comes from the `beta` GitHub Environment (staging URLs + test
# keys). Restrict that environment's deployment branches to `dev` so a push to
# any other branch cannot read its secrets.
#
# Branches (2026-09-21): beta was `develop_1` until now. `dev` is the branch that
# tracks production (dev → main), so beta previews exactly what the next
# production release will be. `develop_1` is now a second test branch whose work
# is not headed for main, and it does NOT publish to beta.
#
# This file is kept identical on `dev` and `develop_1`. A push runs the copy of
# this file on the PUSHED branch, so the `develop_1` copy must say `dev` too —
# otherwise pushes to develop_1 would keep publishing to the beta channel, and
# beta kiosks would get whichever branch pushed last.
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      prerelease: true
      channel_label: beta
      release_type: prerelease
      environment: beta
    secrets: inherit
