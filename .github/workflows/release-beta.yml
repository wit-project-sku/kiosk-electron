name: release-beta

# Testing channel (beta). Fires on every push to the develop branch (a merged PR
# is a push). Publishes a GitHub PRE-release one MINOR ahead of the newest stable
# release (5.0.18 stable -> 5.1.0-beta.<run_number>) — see "Resolve version" in
# release.yml for why a beta must outrank production instead of trailing it.
# Testing kiosks (UPDATE_CHANNEL=beta) pick it up automatically; production kiosks
# never see it.
#
# Runtime config comes from the `beta` GitHub Environment (staging URLs + test
# keys). Restrict that environment's deployment branches to develop_1 so a push
# to any other branch cannot read its secrets.
#
# NOTE: this repo's dev branch is `develop_1`. `develop_v1` is also listed so the
# workflow keeps working if the branch is (re)named to match the original spec.
on:
  push:
    branches: [develop_1, develop_v1]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      prerelease: true
      channel_label: beta
      release_type: prerelease
      environment: beta
    secrets: inherit
