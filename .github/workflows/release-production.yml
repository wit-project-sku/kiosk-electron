name: release-production

# Production channel (latest). Fires on every push to main — which includes a
# merged pull request, since a merge is a push to the target branch. Publishes a
# normal (non-pre) GitHub Release with latest.yml; production kiosks
# (UPDATE_CHANNEL=latest) pick it up automatically.
#
# A release is cut when the package.json version changes: if a release already
# exists for the current version, the run is a no-op (see release.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      prerelease: false
      channel_label: live
      release_type: release
    secrets: inherit
