name: ci

# Checks every change before it can reach a release branch. It never publishes and
# never reads environment secrets — the release workflows (release-beta on dev,
# release-production on main) stay exactly as they were.
#
# Runs on Windows because the kiosks are Windows machines and `npm ci` ABI-rebuilds
# the native modules (better-sqlite3, serialport) for Electron there.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev_kdh]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # electron-vite build only (main + preload + renderer bundles). Packaging and
      # signing stay in release.yml.
      - name: Build
        run: npx electron-vite build
